<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>강의자료 이동</title></head>
<body><p>강의자료의 새 위치로 이동합니다.</p><script>
(function(){
  var m = location.pathname.match(/\/([0-9]{2})-([12])\.html$/);
  if (m) {
    var base = location.pathname.replace(/[^/]+$/, "");
    location.replace(base + m[1] + "/textbook/" + m[1] + "-" + m[2] + ".html" + location.search + location.hash);
  }
}());
</script></body></html>
