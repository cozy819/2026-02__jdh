<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">순차, 선택, 반복 실행 흐름</title>
  <desc id="desc">왼쪽은 위에서 아래로 이어지고, 가운데는 조건에서 두 갈래로 갈라졌다 합쳐지며, 오른쪽은 아래에서 위로 되돌아간다.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .panel{fill:#F1F2F4;stroke:#1B1D21;stroke-width:3}.node{fill:#fff;stroke:#1B1D21;stroke-width:5}.accent{fill:#FF5C00;stroke:#1B1D21;stroke-width:5}.ok{fill:#0E7C86;stroke:#1B1D21;stroke-width:5}.line{fill:none;stroke:#1B1D21;stroke-width:7;stroke-linecap:square;stroke-linejoin:miter}.muted{fill:none;stroke:#6C7078;stroke-width:4;stroke-dasharray:12 12}.num{font:700 36px Archivo,Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.small{font:700 28px Archivo,Arial,sans-serif;fill:#1B1D21;text-anchor:middle;dominant-baseline:middle}
  </style>
  <defs><marker viewBox="0 0 12 12" markerUnits="userSpaceOnUse" id="arrow" markerWidth="24" markerHeight="24" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1B1D21"/></marker></defs>
  <rect class="panel" x="70" y="80" width="440" height="740"/>
  <rect class="panel" x="580" y="80" width="440" height="740"/>
  <rect class="panel" x="1090" y="80" width="440" height="740"/>

  <circle class="accent" cx="290" cy="175" r="34"/><text class="num" x="290" y="176">1</text>
  <rect class="node" x="190" y="255" width="200" height="90"/>
  <rect class="node" x="190" y="430" width="200" height="90"/>
  <rect class="ok" x="190" y="605" width="200" height="90"/>
  <path class="line" marker-end="url(#arrow)" d="M290 210V245M290 345V420M290 520V595"/>

  <circle class="accent" cx="800" cy="175" r="34"/><text class="num" x="800" y="176">2</text>
  <rect class="node" x="700" y="245" width="200" height="80"/>
  <path class="node" d="M800 385L900 465L800 545L700 465Z"/>
  <rect class="node" x="610" y="610" width="150" height="80"/>
  <rect class="node" x="840" y="610" width="150" height="80"/>
  <path class="line" marker-end="url(#arrow)" d="M800 325V375M700 465H650V600M900 465H950V600"/>
  <path class="line" d="M685 690V745H772M915 690V745H828"/>
  <circle class="ok" cx="800" cy="745" r="28"/>

  <circle class="accent" cx="1310" cy="175" r="34"/><text class="num" x="1310" y="176">3</text>
  <rect class="node" x="1210" y="255" width="200" height="90"/>
  <rect class="node" x="1210" y="455" width="200" height="90"/>
  <path class="line" marker-end="url(#arrow)" d="M1310 210V245M1310 345V445"/>
  <path class="line" marker-end="url(#arrow)" d="M1210 500H1160V300H1200"/>
  <path class="muted" d="M1410 500H1470V675H1310"/>
  <circle class="ok" cx="1310" cy="675" r="30"/>
</svg>
