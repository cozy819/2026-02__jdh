<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">평균은 같고 분포는 다른 두 데이터</title>
  <desc id="desc">A는 모든 값이 50이고 B는 10, 30, 50, 70, 90이며 두 데이터의 평균선은 모두 50이다.</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <style>.panel{fill:#F1F2F4;stroke:#1B1D21;stroke-width:3}.axis{stroke:#1B1D21;stroke-width:5}.grid{stroke:#c7c9ce;stroke-width:2}.bar{fill:#6C7078}.hi{fill:#FF5C00}.mean{stroke:#0E7C86;stroke-width:7;stroke-dasharray:18 12}.label{font:700 56px Archivo,Arial,sans-serif;fill:#1B1D21}.tick{font:600 26px Archivo,Arial,sans-serif;fill:#6C7078;text-anchor:end}.value{font:700 28px Archivo,Arial,sans-serif;fill:#1B1D21;text-anchor:middle}</style>
  <rect class="panel" x="70" y="70" width="700" height="760"/><rect class="panel" x="830" y="70" width="700" height="760"/>
  <text class="label" x="110" y="145">A</text><text class="label" x="870" y="145">B</text>
  <g transform="translate(125 150)"><path class="axis" d="M70 570V30M70 570H585"/><g class="grid"><path d="M70 300H585"/><path d="M70 30H585"/></g><text class="tick" x="55" y="578">0</text><text class="tick" x="55" y="308">50</text><text class="tick" x="55" y="38">100</text><g class="bar"><rect x="105" y="300" width="70" height="270"/><rect x="200" y="300" width="70" height="270"/><rect x="295" y="300" width="70" height="270"/><rect x="390" y="300" width="70" height="270"/><rect x="485" y="300" width="70" height="270"/></g><path class="mean" d="M80 300H575"/><g class="value"><text x="140" y="286">50</text><text x="235" y="286">50</text><text x="330" y="286">50</text><text x="425" y="286">50</text><text x="520" y="286">50</text></g></g>
  <g transform="translate(885 150)"><path class="axis" d="M70 570V30M70 570H585"/><g class="grid"><path d="M70 300H585"/><path d="M70 30H585"/></g><text class="tick" x="55" y="578">0</text><text class="tick" x="55" y="308">50</text><text class="tick" x="55" y="38">100</text><rect class="bar" x="105" y="516" width="70" height="54"/><rect class="bar" x="200" y="408" width="70" height="162"/><rect class="hi" x="295" y="300" width="70" height="270"/><rect class="bar" x="390" y="192" width="70" height="378"/><rect class="bar" x="485" y="84" width="70" height="486"/><path class="mean" d="M80 300H575"/><g class="value"><text x="140" y="502">10</text><text x="235" y="394">30</text><text x="330" y="286">50</text><text x="425" y="178">70</text><text x="520" y="70">90</text></g></g>
</svg>
